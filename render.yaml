# Render Blueprint: one free web service + one free Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # Demo accounts so reviewers can test sharing without signing up.
      # For a real customer deployment set SEED_DEMO_DATA to "false".
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        value: password123
      - key: ALLOW_SIGNUP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString

databases:
  - name: ajaia-docs-db
    plan: free
